services:
  app:
    container_name: people-portal
    image: candiedoperation/people-portal:latest

    env_file:
      - .env

    environment:
      PHOTO_CHECK_URL: ${PHOTO_CHECK_URL:-http://pfp-face-check:8001}
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.people-portal.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.people-portal.entrypoints=websecure"
      - "traefik.http.routers.people-portal.tls.certresolver=myresolver"
      - "traefik.http.services.people-portal.loadbalancer.server.port=3000"

  pfp-face-check:
    container_name: pfp-face-check
    image: candiedoperation/pfp-face-check:latest
    restart: unless-stopped

    expose:
      - "8001"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    labels:
      - "traefik.enable=false"

  traefik:
    image: "traefik:v3.3"
    container_name: "traefik"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"

    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
