version: '3.8'

services:
  app:
    container_name: people-portal
    image: candiedoperation/people-portal:latest

    # Applied by hand on the VM and never committed, so a `git pull` would have
    # silently reverted it: without this the container stays down after a crash
    # or a host reboot.
    restart: unless-stopped

    env_file:
      - .env

    # peopleportalredis: private-CA cert so Node trusts the rediss:// endpoint.
    # Public cert, safe to commit. Password lives in .env, never here.
    environment:
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/peopleportalredis-ca.crt

    volumes:
      - "./peopleportalredis-ca.crt:/etc/ssl/certs/peopleportalredis-ca.crt:ro"
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.people-portal.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.people-portal.entrypoints=websecure"
      - "traefik.http.routers.people-portal.tls.certresolver=myresolver"
      - "traefik.http.services.people-portal.loadbalancer.server.port=3000"

    # Also carried over from the VM. Keeps a leak in the app from starving
    # traefik and taking the whole host down with it.
    deploy:
      resources:
        limits:
          memory: 512M

  traefik:
    image: "traefik:v3.3"
    container_name: "traefik"
    restart: unless-stopped

    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"

    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
